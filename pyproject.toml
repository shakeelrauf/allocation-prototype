[project]
name = "newton3"
version = "0.3.0"
description = "Newton 3.0 — behaviour scoring and allocation prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
aws = ["boto3>=1.34", "mangum>=0.17,<0.20"]
dev = ["pytest>=8.0", "httpx>=0.27", "boto3>=1.34"]

[project.scripts]
newton3 = "newton3.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["newton3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
